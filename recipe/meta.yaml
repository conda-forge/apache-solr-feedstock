{% set version = "10.0.0" %}
package:
  name: apache-solr
  version: {{ version }}  # Use the specific version you want to package

source:
  - url: https://github.com/apache/solr/archive/refs/tags/releases/solr/{{ version }}.tar.gz
    sha256: e571ce91c5e2726783b6d47b49cd014067a8aedd71d0bb2b4981990fd80c8b96

build:
  number: 1
  noarch: generic

requirements:
  build:
    - sed
    - zip
    - openjdk =21

  run:
    - openjdk >=11  # Solr requires Java to run

test:
  commands:
    - solr start -h
    - solr stop -h
    # Regression guard for the google-api-client vendored CA trust store stripped
    # in build.sh: make sure it's actually gone, not silently still shipping.
    - test -n "$(find ${PREFIX}/libexec/apache-solr -name 'google-api-client-*.jar')"
    - '! find ${PREFIX}/libexec/apache-solr -name "google-api-client-*.jar" -exec jar tf {} \; | grep -q "com/google/api/client/googleapis/google\.\(p12\|jks\)"'

about:
  home: https://solr.apache.org/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: >
    Solr is highly reliable, scalable and fault tolerant, providing distributed indexing, replication and load-balanced querying, automated failover and recovery, centralized configuration and more.

extra:
  recipe-maintainers:
    - antarcticrainforest
    - tropicrainforest
    - karion
